      .danger{fill:#f8eee0;stroke:#c89c5f;stroke-width:2;stroke-dasharray:7 5}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6Z" fill="#647d87"/></marker>
  </defs>
  <rect width="1200" height="680" fill="#ffffff"/>
  <text x="52" y="45" class="title">方案 A · L1 挂件座可换接口对照</text>
  <text x="52" y="71" class="small">共用同一个右后固定安装区域；挂件、天线、指尖、软带均是待确认包络，A/B 只是卡座机械候选，并非 ABC 音乐模式</text>
  <rect x="52" y="98" width="525" height="477" rx="16" fill="#fcfdfd" stroke="#bfd0d6" stroke-width="1.8"/>
  <rect x="623" y="98" width="525" height="477" rx="16" fill="#fcfdfd" stroke="#bfd0d6" stroke-width="1.8"/>
  <text x="78" y="137" class="h">S1 · 平放浅座（首个几何比较）</text>
  <text x="649" y="137" class="h">S2 · 自然落座浅槽（同步保留）</text>
  <rect x="90" y="161" width="444" height="239" rx="16" class="body"/>
  <path d="M117 178 Q259 280 117 383" class="danger"/>
  <text x="137" y="188" class="small">盘扫掠禁入侧</text>
  <rect x="250" y="189" width="233" height="187" rx="13" class="block"/>
  <circle cx="362" cy="269" r="69" class="tag"/>
  <circle cx="362" cy="269" r="47" fill="none" stroke="#c2d6d5" stroke-width="2"/>
  <circle cx="362" cy="269" r="13" fill="#dceae9" stroke="#69a59a"/>
  <path d="M424 323 q44 4 48 -14" fill="none" stroke="#fff" stroke-width="16"/>
