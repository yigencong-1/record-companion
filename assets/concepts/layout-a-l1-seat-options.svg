<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="Record Companion 方案A L1 可更换静止挂件座：平放浅座与自然落座浅槽对照">
  <defs>
    <style>
      .title{font:700 25px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#203440}
      .h{font:700 20px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#203440}
      .lab{font:15px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#355563}
      .small{font:13px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#61727c}
      .body{fill:#f1f5f5;stroke:#8ea5b0;stroke-width:2}
