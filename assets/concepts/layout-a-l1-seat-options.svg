  <text x="108" y="543" class="lab">优势：低外露高度、图案完整可见</text>
  <text x="108" y="563" class="small">主要核查：平面占用、扣具和指尖取放净空</text>
  <rect x="661" y="161" width="444" height="239" rx="16" class="body"/>
  <path d="M686 178 Q827 280 686 383" class="danger"/>
