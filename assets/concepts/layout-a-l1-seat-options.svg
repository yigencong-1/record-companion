  <text x="1045" y="312" text-anchor="middle" class="small">外露区</text>
  <text x="885" y="362" class="small">自然落入止挡</text>
  <rect x="661" y="441" width="444" height="69" rx="9" class="body"/>
  <path d="M855 493 V460 Q855 450 865 450 H1001 Q1011 450 1011 460 V493" class="block"/>
