  <path d="M431 221 q33 -14 58 -4" fill="none" stroke="#318b7d" stroke-width="2"/>
  <text x="395" y="356" class="small">手指缺口（形状未定）</text>
  <text x="269" y="202" class="small">非金属固定座</text>
  <rect x="90" y="441" width="444" height="69" rx="9" class="body"/>
