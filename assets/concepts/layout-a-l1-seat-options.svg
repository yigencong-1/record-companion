  <text x="674" y="463" class="small">剖面意向</text>
  <text x="674" y="485" class="small">露出上缘</text>
  <text x="935" y="490" text-anchor="middle" class="small">天线姿态需变更</text>
  <text x="676" y="543" class="lab">优势：可减少顶部平面投影（待核）</text>
  <text x="676" y="563" class="small">主要核查：倾角、拔出轨迹、异形卡、天线朝向</text>
  <rect x="52" y="601" width="1096" height="55" rx="9" fill="#f5f7f8" stroke="#dbe3e6"/>
  <text x="70" y="624" class="lab">共同边界：卡座不随大盘转动；不可刺穿密闭音腔；读卡线圈、金属挂扣、邻片、取放手部与盘边动态包络须分别验证</text>
  <text x="70" y="645" class="small">图中弧线与卡片比例都是示意；读区性能、物理离座速度和结构公差未实测，不可据此选定 S1 或 S2。</text>
</svg>