  <text x="420" y="867" class="tiny">后</text>
  <text x="151" y="992" text-anchor="middle" class="tiny">PCB</text>
  <text x="259" y="991" text-anchor="middle" class="tiny">驱动</text>
  <text x="360" y="992" text-anchor="middle" class="tiny">电池</text>
  <text x="483" y="862" class="label">侧视的外壳水平跨度＝顶视机身深度</text>
  <text x="483" y="887" class="small">① 大唱片水平放置，盘下固定柔光圈（浅金）</text>
  <text x="483" y="913" class="small">② 承盘轴承独立承担重量，电机只传递扭矩</text>
  <text x="483" y="939" class="small">③ 电路、低位电池是独立维护单元，不借用音腔</text>
  <text x="483" y="965" class="small">④ 静止挂件座位于后端固定区域（浅绿）</text>
  <text x="483" y="991" class="small">⑤ 后盖、接口、排线和维修空间须用真实器件重建</text>
  <rect x="480" y="1015" width="624" height="39" rx="7" fill="#f5f7f7" stroke="#dbe3e6"/>
  <text x="491" y="1039" class="small">视图按同一示意长度尺度表达外壳外轮廓；内部块是功能占位，非组件机械尺寸。</text>
  <text x="86" y="1085" class="subtitle">示意色：深灰＝运动件　浅蓝＝声学／电子分区　浅绿＝固定挂件座　浅金＝固定柔光圈　虚线＝未冻结或运行包络</text>
</svg>