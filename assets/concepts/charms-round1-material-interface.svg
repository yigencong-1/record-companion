<text x="1187" y="1012.5" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#283739" text-anchor="start">4–6 mm宽非金属软连接</text>
<text x="1187" y="1052.78" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#657574" text-anchor="start">展开25–40 mm作为样片比较</text>
<text x="943" y="1167.78" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#283739" text-anchor="start">织带拉力经壳体承力桥传递；标签、芯片、墨层不承担拉力。</text>
<text x="943" y="1208.92" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#657574" text-anchor="start">扣具停放区由结构专项提供；软带不能落进转盘或插槽。</text>
