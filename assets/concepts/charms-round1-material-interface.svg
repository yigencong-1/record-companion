<text x="959" y="1436.78" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#657574" text-anchor="start">槽宽取决于成品最大厚度、翘曲与公差</text>
<text x="959" y="1481.78" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#657574" text-anchor="start">薄卡与厚卡混用要测导向；不靠强塞固定</text>
<text x="959" y="1526.78" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#657574" text-anchor="start">读卡线圈方向须适配；图中深度未定</text>
<text x="87" y="1597.92" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#657574" text-anchor="start">紫色表示标签占位，绿色表示壳体／读卡接口；位置关系仅用于联合评审。</text>
