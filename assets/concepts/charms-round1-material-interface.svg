<text x="653" y="649.78" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#657574" text-anchor="start">较薄PC背面朝读区；透明面先测开裂。</text>
<text x="653" y="688.92" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#657574" text-anchor="start">胶合基厚约3.26 mm，覆膜另计。</text>
