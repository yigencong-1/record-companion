<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="layout-title layout-desc">
  <title id="layout-title">双声道、前屏与电池唱片桌搭布局建议</title>
  <desc id="layout-desc">左侧为俯视功能分区，左右扬声器分别留音腔，中间保留顶部唱片互动及电池电路位置。右侧为正面显示屏和两侧出声位置示意。没有确定尺寸、内部容积或可制造结构。</desc>
  <defs>
    <pattern id="vent" width="8" height="12" patternUnits="userSpaceOnUse"><path d="M4 2V10" stroke="#727772" stroke-width="2"/></pattern>
    <marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5a7565"/></marker>
  </defs>
  <style>
    text {font-family: 'Microsoft YaHei', 'Noto Sans SC', sans-serif; fill:#252d29; font-size:24px;}
    .title {font-size:34px; font-weight:500;}
    .heading {font-size:28px; font-weight:500;}
    .note {font-size:22px; fill:#5e6861;}
    .small {font-size:20px;}
    .groove {fill:none; stroke:#4d5550; stroke-width:2;}
  </style>
  <rect width="1200" height="700" fill="#f7f8f6"/>
  <text x="40" y="52" class="title">左右出声、前面显示，顶部保留唱片互动</text>
  <text x="40" y="94" class="note">功能位置建议 · 尺寸、音腔、电池和电机安装均待验证 · 配色未定</text>

  <text x="80" y="166" class="heading">俯视功能分区</text>
  <rect x="80" y="205" width="530" height="300" rx="8" fill="#e1e6e0" stroke="#69776d" stroke-width="2"/>
  <rect x="92" y="220" width="85" height="269" rx="4" fill="#d1ded4" stroke="#75917d" stroke-dasharray="7 5"/>
  <rect x="512" y="220" width="85" height="269" rx="4" fill="#e8d7d0" stroke="#a78375" stroke-dasharray="7 5"/>
  <text x="134" y="300" text-anchor="middle">左侧</text>
  <text x="134" y="335" text-anchor="middle">扬声器</text>
  <text x="134" y="402" text-anchor="middle" class="small">独立音腔</text>
  <text x="554" y="300" text-anchor="middle">右侧</text>
  <text x="554" y="335" text-anchor="middle">扬声器</text>
  <text x="554" y="402" text-anchor="middle" class="small">独立音腔</text>
  <circle cx="287" cy="332" r="80" fill="#2e3431"/>
  <circle cx="287" cy="332" r="67" class="groove"/>
  <circle cx="287" cy="332" r="53" class="groove"/>
  <circle cx="287" cy="332" r="37" class="groove"/>
  <circle cx="287" cy="332" r="22" fill="#d09b86"/>
  <circle cx="287" cy="332" r="4" fill="#303733"/>
  <rect x="391" y="274" width="100" height="116" rx="5" fill="#c0cbc1"/>
  <circle cx="441" cy="329" r="42" fill="#303733"/>
  <circle cx="441" cy="329" r="30" class="groove"/>
  <circle cx="441" cy="329" r="15" fill="#90ac96"/>
  <path d="M451 289Q460 269 474 278Q485 287 475 294" fill="none" stroke="#7c887f" stroke-width="4"/>
  <text x="285" y="246" text-anchor="middle" class="small">大唱片转动</text>
  <text x="441" y="422" text-anchor="middle" class="small">挂件静止识别</text>
  <rect x="190" y="446" width="308" height="43" rx="4" fill="#f4f6f2"/>
  <text x="344" y="474" text-anchor="middle" class="small">电池 / 电路安装区（待排布）</text>

  <text x="692" y="166" class="heading">正面与两侧出声位置</text>
  <rect x="692" y="268" width="420" height="196" rx="8" fill="#dce2dc" stroke="#69776d" stroke-width="2"/>
  <rect x="674" y="287" width="18" height="158" rx="3" fill="url(#vent)" stroke="#8a978d"/>
  <rect x="1112" y="287" width="18" height="158" rx="3" fill="url(#vent)" stroke="#8a978d"/>
  <rect x="757" y="292" width="255" height="148" rx="4" fill="#28372f"/>
  <text x="777" y="326" style="fill:#cfdfd0;font-size:20px">离线日常界面示意</text>
  <text x="777" y="374" style="fill:#f1f5ef;font-size:40px">09:41</text>
  <text x="777" y="412" style="fill:#d0ded2;font-size:20px">本地音乐 · 电量与状态</text>
  <circle cx="1054" cy="390" r="21" fill="#f2f5ef" stroke="#7b897d" stroke-width="2"/>
  <path d="M1054 373V382" stroke="#5d7564" stroke-width="3"/>
  <path d="M681 247V220H735" fill="none" stroke="#5a7565" stroke-width="2"/>
  <text x="746" y="227" class="small">左侧出声</text>
  <path d="M1123 247V220H1071" fill="none" stroke="#a78375" stroke-width="2"/>
  <text x="1060" y="227" text-anchor="end" class="small">右侧出声</text>
  <text x="902" y="509" text-anchor="middle" class="note">前屏显示与操作，侧面留给扬声器</text>

  <path d="M80 561H1120" stroke="#ccd3cc"/>
  <text x="80" y="602" class="note">左右分别播放L/R声道；侧向与稍向前出声需试听，双扬声器不自动保证更好的音质。</text>
  <text x="80" y="642" class="note">电池、双音腔、前屏和转动机构一起决定体积；上一轮15厘米 / 12厘米尺寸不能直接沿用。</text>
  <text x="80" y="680" class="small">网络建议：Wi-Fi或手机热点；无网保留本地功能，AI用途确定后再验证。</text>
</svg>
