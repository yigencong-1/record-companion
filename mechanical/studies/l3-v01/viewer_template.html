<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>唱片桌搭 · 三维装配研究</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f0e8;color:#283c40;font:15px system-ui,sans-serif}header{padding:20px;max-width:1100px;margin:auto}h1{font-size:23px;margin:0 0 9px}p{line-height:1.6;margin:8px 0}nav{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}button,select{padding:10px;border:1px solid #9ba8a6;background:#fffaf0;border-radius:7px;color:#283c40;font:inherit}button[aria-pressed=true]{background:#23636d;color:white}canvas{display:block;width:100%;height:min(68vh,660px);min-height:360px;touch-action:none}footer{max-width:1100px;margin:auto;padding:15px 20px}.row{display:flex;flex-wrap:wrap;align-items:center;gap:15px}input{width:150px}#status{font-size:13px}</style>
<header><h1>唱片桌搭 · 三维装配研究 v0.1</h1><p>由实际 CAD 实体生成。研究占位：外壳 400×260×134 mm，大盘直径 220 mm；不是成品尺寸。</p><nav><button data-mode="all" aria-pressed="false">整机</button><button data-mode="inside" aria-pressed="true">内部结构</button><button data-mode="frame" aria-pressed="false">骨架与传动</button><button data-mode="exploded" aria-pressed="false">爆炸视图</button></nav><div class="row"><label>观察角度 <select id="angle"><option value="iso">斜视</option><option value="top">俯视</option><option value="front">正视</option><option value="side">右视</option></select></label><label>缩放 <input id="zoom" type="range" min="0.6" max="1.8" step=".05" value="1"></label><button id="reset">恢复视角</button></div></header>
<canvas id="view" aria-label="可拖动旋转的真实 CAD 网格模型"></canvas><footer><p>拖动旋转；滚轮或滑块缩放。青色为骨架，橙色为部分电子占位与联轴器。爆炸位移仅供观察，不表示可行装配顺序。</p><p id="status"></p><p>尚缺：完整紧固与防脱、真实器件模型、线束、振动及音质、射频、强度、制造公差。S1 浅座仅为本版研究姿态，S2 浅槽仍保留。</p></footer>
<script>
const meshes=__MESHES__;const canvas=document.getElementById('view'),gl=canvas.getContext('webgl',{antialias:true});let mode='inside',yaw=-.55,pitch=.65,zoom=1,drag=null;
if(!gl){document.getElementById('status').textContent='当前浏览器未启用 WebGL，请查看附带 PNG 或在 CAD 软件打开 STEP。';throw Error('WebGL unavailable');}
const vs=`attribute vec3 pos;attribute vec3 normal;uniform vec2 turn;uniform vec2 size;uniform vec3 offset;uniform float lift;varying float light;void main(){float c=cos(turn.x),s=sin(turn.x),cp=cos(turn.y),sp=sin(turn.y);vec3 a=pos+offset-vec3(0.,0.,85.);vec3 b=vec3(a.x*c-a.y*s,a.x*s+a.y*c,a.z);vec3 v=vec3(b.x,b.y*sp+b.z*cp,-b.y*cp+b.z*sp);vec3 n=vec3(normal.x*c-normal.y*s,normal.x*s+normal.y*c,normal.z);n=vec3(n.x,n.y*sp+n.z*cp,-n.y*cp+n.z*sp);light=.48+.52*abs(dot(normalize(n),normalize(vec3(-.35,.45,.82))));gl_Position=vec4(v.x*size.x,(v.y-lift)*size.y,-v.z/1000.,1.);}`;
const fs=`precision mediump float;uniform vec3 color;varying float light;void main(){gl_FragColor=vec4(color*light,1.);}`;
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
const prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vs));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prog));gl.useProgram(prog);
const ap=gl.getAttribLocation(prog,'pos'),an=gl.getAttribLocation(prog,'normal'),ut=gl.getUniformLocation(prog,'turn'),us=gl.getUniformLocation(prog,'size'),uo=gl.getUniformLocation(prog,'offset'),uc=gl.getUniformLocation(prog,'color'),ul=gl.getUniformLocation(prog,'lift');
const buffers=meshes.map(m=>{const data=[];for(const f of m.faces){const a=m.vertices[f[0]],b=m.vertices[f[1]],c=m.vertices[f[2]],u=b.map((x,i)=>x-a[i]),v=c.map((x,i)=>x-a[i]),n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]],len=Math.hypot(...n)||1;for(const i of f)data.push(...m.vertices[i],...n.map(x=>x/len));}const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.STATIC_DRAW);return {buf,count:data.length/6};});
function visible(m){if(mode==='inside')return !['shell','disc','lighting','cover'].includes(m.group);if(mode==='frame')return ['frame','drive','fastener','seat'].includes(m.group);return true;}
function draw(){const w=canvas.clientWidth,h=canvas.clientHeight,dpr=window.devicePixelRatio||1;canvas.width=w*dpr;canvas.height=h*dpr;gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(.953,.941,.91,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);const scale=Math.min(w/520,h/390)*zoom*(mode==='exploded'?.77:1);gl.uniform2f(ut,yaw,pitch);gl.uniform2f(us,2*scale/w,2*scale/h);gl.uniform1f(ul,mode==='exploded'?45:0);for(let i=0;i<meshes.length;i++){const m=meshes[i];if(!visible(m))continue;gl.bindBuffer(gl.ARRAY_BUFFER,buffers[i].buf);gl.vertexAttribPointer(ap,3,gl.FLOAT,false,24,0);gl.vertexAttribPointer(an,3,gl.FLOAT,false,24,12);gl.enableVertexAttribArray(ap);gl.enableVertexAttribArray(an);gl.uniform3fv(uo,mode==='exploded'?m.explode:[0,0,0]);gl.uniform3fv(uc,m.color);gl.drawArrays(gl.TRIANGLES,0,buffers[i].count);}document.getElementById('status').textContent=`可见部件 ${meshes.filter(visible).length} / ${meshes.length} · 真实 CAD 网格 · 静态几何检查见 geometry_report.json`;}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));draw();});
document.getElementById('angle').onchange=e=>{[yaw,pitch]=({iso:[-.55,.65],top:[0,Math.PI/2],front:[0,0],side:[Math.PI/2,0]})[e.target.value];draw();};document.getElementById('zoom').oninput=e=>{zoom=+e.target.value;draw();};document.getElementById('reset').onclick=()=>{yaw=-.55;pitch=.65;zoom=1;document.getElementById('zoom').value=1;document.getElementById('angle').value='iso';draw();};canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.008;pitch=Math.max(-1.4,Math.min(1.55,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];draw();};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.6,Math.min(1.8,zoom-e.deltaY*.001));document.getElementById('zoom').value=zoom;draw()};new ResizeObserver(draw).observe(canvas);draw();
</script></html>
